name: Combat debug cleanup

on:
  push:
    branches:
      - feature/26-combat-debug-cleanup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/26-combat-debug-cleanup
          fetch-depth: 0

      - name: Apply exact QA-tested debug flag changes
        shell: python
        run: |
          from pathlib import Path

          changes = {
              "src/WorldPlace/ServerScriptService/CombatServer.server.luau": [
                  ("local DEBUG_HITBOX_VISUALS =\n\ttrue", "local DEBUG_HITBOX_VISUALS =\n\tfalse"),
                  ("local DEBUG_M1 = true", "local DEBUG_M1 = false"),
              ],
              "src/WorldPlace/StarterPlayer/StarterCharacterScripts/AttackController.client.luau": [
                  ("local DEBUG_ATTACK = true", "local DEBUG_ATTACK = false"),
              ],
              "src/WorldPlace/StarterPlayer/StarterCharacterScripts/LungeAttackController.client.luau": [
                  ("local DEBUG_LUNGE =\n\ttrue", "local DEBUG_LUNGE =\n\tfalse"),
              ],
              "src/WorldPlace/StarterPlayer/StarterCharacterScripts/AerialKickController.client.luau": [
                  ("local DEBUG =\n\ttrue", "local DEBUG =\n\tfalse"),
              ],
              "src/WorldPlace/StarterPlayer/StarterCharacterScripts/LauncherController.client.luau": [
                  ("local DEBUG =\n\ttrue", "local DEBUG =\n\tfalse"),
              ],
              "src/WorldPlace/ServerScriptService/LauncherServerCore.luau": [
                  ("local DEBUG =\n\ttrue", "local DEBUG =\n\tfalse"),
              ],
              "src/WorldPlace/ServerScriptService/ClashServerCore.luau": [
                  ("local DEBUG =\n\ttrue", "local DEBUG =\n\tfalse"),
              ],
              "src/WorldPlace/StarterPlayer/StarterCharacterScripts/SubstitutionController.client.luau": [
                  ("local DEBUG =\n\ttrue", "local DEBUG =\n\tfalse"),
              ],
              "src/WorldPlace/StarterPlayer/StarterPlayerScripts/CombatImpactVFXController.client.luau": [
                  ("local PRODUCED_TEMPLATE_DEBUG =\n\ttrue", "local PRODUCED_TEMPLATE_DEBUG =\n\tfalse"),
                  ("local HIT_VFX_RUNTIME_DEBUG =\n\ttrue", "local HIT_VFX_RUNTIME_DEBUG =\n\tfalse"),
              ],
          }

          for path_str, replacements in changes.items():
              path = Path(path_str)
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  old_count = text.count(old)
                  new_count = text.count(new)
                  if old_count == 1:
                      text = text.replace(old, new, 1)
                  elif old_count == 0 and new_count == 1:
                      # Already changed earlier in this branch (SubstitutionController).
                      pass
                  else:
                      raise SystemExit(
                          f"Unexpected replacement state for {path_str}: old={old_count}, new={new_count}"
                      )
              path.write_text(text, encoding="utf-8", newline="\n")

      - name: Verify only approved files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t files < <(git diff --name-only)
          allowed='^(src/WorldPlace/ServerScriptService/CombatServer\.server\.luau|src/WorldPlace/StarterPlayer/StarterCharacterScripts/AttackController\.client\.luau|src/WorldPlace/StarterPlayer/StarterCharacterScripts/LungeAttackController\.client\.luau|src/WorldPlace/StarterPlayer/StarterCharacterScripts/AerialKickController\.client\.luau|src/WorldPlace/StarterPlayer/StarterCharacterScripts/LauncherController\.client\.luau|src/WorldPlace/ServerScriptService/LauncherServerCore\.luau|src/WorldPlace/ServerScriptService/ClashServerCore\.luau|src/WorldPlace/StarterPlayer/StarterCharacterScripts/SubstitutionController\.client\.luau|src/WorldPlace/StarterPlayer/StarterPlayerScripts/CombatImpactVFXController\.client\.luau)$'
          for f in "${files[@]}"; do
            [[ "$f" =~ $allowed ]] || { echo "Unexpected changed file: $f"; exit 1; }
          done
          git diff --stat

      - name: Commit exact candidate
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No additional changes required.'
            exit 0
          fi
          git config user.name 'WAYLESS QA Sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/WorldPlace
          git commit -m 'Combat: sync QA-tested debug flags'
          git push origin HEAD:feature/26-combat-debug-cleanup
